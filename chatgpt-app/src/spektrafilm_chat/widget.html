<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:light dark;font:15px system-ui,sans-serif}body{margin:0;padding:18px;color:light-dark(#20231f,#edf1e8);background:light-dark(#f7f8f4,#191c18)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:18px;margin:0}small,p{color:light-dark(#65705f,#abb6a4)}
img{display:block;width:100%;max-height:650px;object-fit:contain;border-radius:12px;margin:16px 0;background:light-dark(#e8ebe3,#0e110d)}
nav{display:flex;gap:8px;flex-wrap:wrap}a{color:inherit;text-decoration:none;padding:11px 16px;border:1px solid light-dark(#c8cfc0,#56634c);border-radius:24px;font-weight:600}a:first-child{background:light-dark(#d2e6b7,#3f5a2b)}[hidden]{display:none!important}
</style></head><body><header><h1>Spektrafilm</h1><small id="status">Проявка RAW</small></header>
<p id="description">Результат появится здесь после обработки снимка.</p><img id="photo" hidden alt="Фото после проявки плёнки и сканирования">
<nav id="links" hidden aria-label="Скачать готовую фотографию"></nav><p id="retention" hidden><small>Скачайте результат в течение 24 часов. Исходный RAW удаляется после обработки.</small></p>
<script>
const $=id=>document.getElementById(id);
function render(data){
 if(!data?.files)return;
 $('status').textContent=`${data.width} × ${data.height}`;
 $('description').textContent=`${data.film} · ${data.scanner==='noritsu-ls600'?'Noritsu LS-600 · без бумаги':'цифровой скан'} · Arctic`;
 const preview=data.files['preview.jpg']?.url;
 if(preview){const url=new URL(preview);if(['http:','https:'].includes(url.protocol)){$('photo').src=url.href;$('photo').hidden=false;}}
 $('links').replaceChildren();
 for(const [name,label]of [['result.jpg','Скачать JPEG'],['result.tiff','TIFF · 16 бит'],['result.png','PNG']]){
  const item=data.files[name];if(!item)continue;const url=new URL(item.url);if(!['http:','https:'].includes(url.protocol))continue;
  const link=document.createElement('a');link.href=url.href;link.textContent=label;link.target='_blank';link.rel='noopener noreferrer';
  link.addEventListener('click',event=>{if(window.openai?.openExternal){event.preventDefault();window.openai.openExternal({href:url.href});}});
  $('links').append(link);
 }
 $('links').hidden=false;$('retention').hidden=false;
 window.openai?.notifyIntrinsicHeight?.(document.documentElement.scrollHeight);
}
render(window.openai?.toolOutput);
window.addEventListener('openai:set_globals',event=>render(event.detail?.globals?.toolOutput));
// Standard MCP Apps tool-result notifications; the OpenAI host bridge above remains supported.
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(m?.jsonrpc!=='2.0')return;if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent);if(m.id==='spektrafilm-init'&&m.result)window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');});
if(window.parent!==window)window.parent.postMessage({jsonrpc:'2.0',id:'spektrafilm-init',method:'ui/initialize',params:{appInfo:{name:'Spektrafilm',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'}},'*');
</script></body></html>

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "spektrafilm-chatgpt"
version = "0.1.0"
description = "ChatGPT file tools backed by the Spektrafilm Android RAW decoder and C++ engine"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["mcp==1.29.0", "httpx==0.28.1", "uvicorn==0.52.1", "numpy==2.3.5", "Pillow==13.0.0", "tifffile==2026.11.16", "PyJWT[crypto]==2.13.0", "pydantic==2.13.4"]

[project.scripts]
spektrafilm-chatgpt = "spektrafilm_chat.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spektrafilm_chat = ["widget.html"]

name: Publish native Spektrafilm Lab APK
on:
  push:
    branches: [apk-delivery-native-9-67-22c346d]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify, publish and download the complete APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo '82c5138c3e8e2c0ef6078245d7c344d2dac2e5527309943dce34f198dc56a884  release-payload/Spektrafilm-v9.67.0.apk' | sha256sum --check
          if ! gh release view v9.67.0 >/dev/null 2>&1; then
            gh release create v9.67.0 --target 22c346d028151d0c890b6cdba730e65a882afe2d --prerelease --title 'Spektrafilm Lab 9.67 — Профильные стадии Noritsu · ARM64' --notes-file release-payload/notes.md
          fi
          if ! gh release view v9.67.0 --json assets --jq '.assets[].name' | grep -Fxq 'Spektrafilm-v9.67.0.apk'; then
            gh release upload v9.67.0 release-payload/Spektrafilm-v9.67.0.apk
          fi
          mkdir downloaded
          gh release download v9.67.0 --pattern Spektrafilm-v9.67.0.apk --dir downloaded
          echo '82c5138c3e8e2c0ef6078245d7c344d2dac2e5527309943dce34f198dc56a884  downloaded/Spektrafilm-v9.67.0.apk' | sha256sum --check

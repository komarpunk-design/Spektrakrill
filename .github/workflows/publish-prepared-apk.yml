name: Publish native Spektrafilm Lab APK
on:
  push:
    branches: [apk-delivery-native-9-58-0093b1d]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify, publish and download the complete APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'd7791e478d27a80fbe0605670322bad89a59b2dba68a0b9722257181aacc54c7  release-payload/Spektrafilm-v9.58.0.apk' | sha256sum --check
          if ! gh release view v9.58.0 >/dev/null 2>&1; then
            gh release create v9.58.0 --target 0093b1dc2cc9d264d62dc948c767134aa6baff7f --prerelease --title 'Spektrafilm Lab 9.58 — Порядок 9.56 · ARM64' --notes-file release-payload/notes.md
          fi
          if ! gh release view v9.58.0 --json assets --jq '.assets[].name' | grep -Fxq 'Spektrafilm-v9.58.0.apk'; then
            gh release upload v9.58.0 release-payload/Spektrafilm-v9.58.0.apk
          fi
          mkdir downloaded
          gh release download v9.58.0 --pattern Spektrafilm-v9.58.0.apk --dir downloaded
          echo 'd7791e478d27a80fbe0605670322bad89a59b2dba68a0b9722257181aacc54c7  downloaded/Spektrafilm-v9.58.0.apk' | sha256sum --check

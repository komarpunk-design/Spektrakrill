name: Publish prepared workflow APK
on:
  push:
    branches: [apk-delivery-9-50-f4a149b]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify, publish and download the complete APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo '882dfb43624353559baf488d220f404073734726301a4904b4781d4b604e0f4f  release-payload/SpektrafilmLab-9.50-arm64.apk' | sha256sum --check
          if ! gh release view v9.50-build120 >/dev/null 2>&1; then
            gh release create v9.50-build120 --target f4a149bfa84ad4e9889a59c745f474990d08e847 --prerelease --title 'Spektrafilm 9.50 — Outputs / Lab Scan · ARM64' --notes-file release-payload/notes.md
          fi
          if ! gh release view v9.50-build120 --json assets --jq '.assets[].name' | grep -Fxq 'SpektrafilmLab-9.50-arm64.apk'; then
            gh release upload v9.50-build120 release-payload/SpektrafilmLab-9.50-arm64.apk
          fi
          mkdir downloaded
          gh release download v9.50-build120 --pattern SpektrafilmLab-9.50-arm64.apk --dir downloaded
          echo '882dfb43624353559baf488d220f404073734726301a4904b4781d4b604e0f4f  downloaded/SpektrafilmLab-9.50-arm64.apk' | sha256sum --check

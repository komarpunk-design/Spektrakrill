name: Publish native Spektrafilm Lab APK
on:
  push:
    branches: [apk-delivery-native-9-76-ecfe299]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify, publish and download the complete APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo '48b8dc82c18b6fead73bbcabc78aabf46a3016f9cd6f466b433141e5a6537266  release-payload/Spektrafilm-v9.76.0.apk' | sha256sum --check
          if ! gh release view v9.76.0 >/dev/null 2>&1; then
            gh release create v9.76.0 --target ecfe29920d7e0313252dcc4cba0f28bd761c671d --prerelease --title 'Spektrafilm Lab 9.76 — Arctic · Layered Transport · быстрый предпросмотр · ARM64' --notes-file release-payload/notes.md
          fi
          if ! gh release view v9.76.0 --json assets --jq '.assets[].name' | grep -Fxq 'Spektrafilm-v9.76.0.apk'; then
            gh release upload v9.76.0 release-payload/Spektrafilm-v9.76.0.apk
          fi
          mkdir downloaded
          gh release download v9.76.0 --pattern Spektrafilm-v9.76.0.apk --dir downloaded
          echo '48b8dc82c18b6fead73bbcabc78aabf46a3016f9cd6f466b433141e5a6537266  downloaded/Spektrafilm-v9.76.0.apk' | sha256sum --check

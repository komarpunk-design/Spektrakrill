name: Publish native Spektrafilm Lab APK
on:
  push:
    branches: [apk-delivery-native-9-73-11efdc1]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify, publish and download the complete APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo '7d939e6886a9b26499402cb207efe09fecc46e9ca1435210b59679daa9857eb0  release-payload/Spektrafilm-v9.73.0.apk' | sha256sum --check
          if ! gh release view v9.73.0 >/dev/null 2>&1; then
            gh release create v9.73.0 --target 11efdc1af30d0f910bea1863b103798560784bf3 --prerelease --title 'Spektrafilm Lab 9.73 — Согласованность обработки · ARM64' --notes-file release-payload/notes.md
          fi
          if ! gh release view v9.73.0 --json assets --jq '.assets[].name' | grep -Fxq 'Spektrafilm-v9.73.0.apk'; then
            gh release upload v9.73.0 release-payload/Spektrafilm-v9.73.0.apk
          fi
          mkdir downloaded
          gh release download v9.73.0 --pattern Spektrafilm-v9.73.0.apk --dir downloaded
          echo '7d939e6886a9b26499402cb207efe09fecc46e9ca1435210b59679daa9857eb0  downloaded/Spektrafilm-v9.73.0.apk' | sha256sum --check

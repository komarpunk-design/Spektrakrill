name: Publish native Spektrafilm Lab APK
on:
  push:
    branches: [apk-delivery-native-9-61-89412b4]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify, publish and download the complete APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo '52368f76ddae7abddd8414f4db889872ef9a0f71f0e5d054b85ea16bd0e10176  release-payload/Spektrafilm-v9.61.0.apk' | sha256sum --check
          if ! gh release view v9.61.0 >/dev/null 2>&1; then
            gh release create v9.61.0 --target 89412b48adf7110e5c2148a8c3c7ef9ed1d537c3 --prerelease --title 'Spektrafilm Lab 9.61 — RAW: память предпросмотра · ARM64' --notes-file release-payload/notes.md
          fi
          if ! gh release view v9.61.0 --json assets --jq '.assets[].name' | grep -Fxq 'Spektrafilm-v9.61.0.apk'; then
            gh release upload v9.61.0 release-payload/Spektrafilm-v9.61.0.apk
          fi
          mkdir downloaded
          gh release download v9.61.0 --pattern Spektrafilm-v9.61.0.apk --dir downloaded
          echo '52368f76ddae7abddd8414f4db889872ef9a0f71f0e5d054b85ea16bd0e10176  downloaded/Spektrafilm-v9.61.0.apk' | sha256sum --check

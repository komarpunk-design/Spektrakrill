name: Publish native Spektrafilm Lab APK
on:
  push:
    branches: [apk-delivery-native-9-63-ef8f391]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify, publish and download the complete APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo '7268908f8ea8877ce3752425b21c0d1c78c4252218842ccd40e186a8715bf0d8  release-payload/Spektrafilm-v9.63.0.apk' | sha256sum --check
          if ! gh release view v9.63.0 >/dev/null 2>&1; then
            gh release create v9.63.0 --target ef8f391fa6bb6b8a3152649a639c9d5594991589 --prerelease --title 'Spektrafilm Lab 9.63 — Качество RAW-предпросмотра · ARM64' --notes-file release-payload/notes.md
          fi
          if ! gh release view v9.63.0 --json assets --jq '.assets[].name' | grep -Fxq 'Spektrafilm-v9.63.0.apk'; then
            gh release upload v9.63.0 release-payload/Spektrafilm-v9.63.0.apk
          fi
          mkdir downloaded
          gh release download v9.63.0 --pattern Spektrafilm-v9.63.0.apk --dir downloaded
          echo '7268908f8ea8877ce3752425b21c0d1c78c4252218842ccd40e186a8715bf0d8  downloaded/Spektrafilm-v9.63.0.apk' | sha256sum --check

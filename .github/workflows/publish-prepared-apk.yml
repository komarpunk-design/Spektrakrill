name: Publish native Spektrafilm Lab APK
on:
  push:
    branches: [apk-delivery-native-9-68-6f0281c]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify, publish and download the complete APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo '157b3737e957fbd09f1e5762659b8df2adc8b8f0c9e1a0c95720eb4b8e2861f6  release-payload/Spektrafilm-v9.68.0.apk' | sha256sum --check
          if ! gh release view v9.68.0 >/dev/null 2>&1; then
            gh release create v9.68.0 --target 6f0281ca481f6749f0c05be5565ce5d60e61bb2f --prerelease --title 'Spektrafilm Lab 9.68 — Виртуальный негатив · ARM64' --notes-file release-payload/notes.md
          fi
          if ! gh release view v9.68.0 --json assets --jq '.assets[].name' | grep -Fxq 'Spektrafilm-v9.68.0.apk'; then
            gh release upload v9.68.0 release-payload/Spektrafilm-v9.68.0.apk
          fi
          mkdir downloaded
          gh release download v9.68.0 --pattern Spektrafilm-v9.68.0.apk --dir downloaded
          echo '157b3737e957fbd09f1e5762659b8df2adc8b8f0c9e1a0c95720eb4b8e2861f6  downloaded/Spektrafilm-v9.68.0.apk' | sha256sum --check

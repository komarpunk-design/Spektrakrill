apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.spectrafilm.engine'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        minSdk 24
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared',
                        '-DSPK_ENABLE_VULKAN=ON',
                        '-DSPK_ENABLE_HIGHWAY=ON',
                        '-DSPK_TUNE_ARM64=ON',
                        '-DSPK_TUNE_ONLY=ON',
                        '-DSPK_TUNE_ARM64_CPU=cortex-a76',
                        '-DCMAKE_CXX_FLAGS_RELEASE=-O3 -ffast-math -fno-finite-math-only -fopenmp-simd',
                        '-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O3 -ffast-math -fno-finite-math-only -fopenmp-simd -DNDEBUG',
                        '-DCMAKE_CXX_FLAGS_DEBUG=-O2 -g -fopenmp-simd'
                abiFilters 'arm64-v8a'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

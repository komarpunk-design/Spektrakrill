[package]
name = "spektrafilm-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
negs-library = { path = "../negs-library" }
spektrafilm-core.workspace = true
spektrafilm-gpu.workspace = true
spektrafilm-math.workspace = true
spektrafilm-io.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
image.workspace = true
rayon.workspace = true
tracing-subscriber.workspace = true

[lib]
name = "negs_android"
path = "src/android.rs"
crate-type = ["staticlib", "rlib"]

[features]
android-reference = ["spektrafilm-core/precision-f64", "spektrafilm-gpu/precision-f64", "spektrafilm-math/precision-f64", "spektrafilm-io/precision-f64"]
